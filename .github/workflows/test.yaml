name: Test

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman (static security scan)
        run: bin/brakeman --no-pager
      - name: bundler-audit (known gem CVEs)
        # Advisory only until the dependency updates in #78 land; remove
        # continue-on-error then so new CVEs fail the build.
        continue-on-error: true
        run: bin/bundler-audit check --update

  test:
    runs-on: ubuntu-latest

    # If you need DB like PostgreSQL, Redis then define service below.
    # https://github.com/actions/example-services/tree/master/.github/workflows
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test
      GEMFILE_RUBY_VERSION: 3.0.0
      # Rails verifies the time zone in DB is the same as the time zone of the Rails app
      # TZ: "Europe/Berlin"

    steps:
      - uses: actions/checkout@v4
      # Plain apt-get: cache-apt-pkgs-action skips update-alternatives, so
      # a cached ffmpeg can't find libblas.so.3.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads the Ruby version from .ruby-version
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Update Dependencies
        run: |
          bundle check || bundle install
          yarn install --immutable --immutable-cache --check-cache
          bin/rails assets:precompile
      - name: Create DB
        run: |
          bin/rails db:prepare
      - name: Run tests
        run: |
          bin/rails test