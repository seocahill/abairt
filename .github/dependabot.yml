version: 2
updates:
  # Patch and minor bumps arrive as one grouped PR per ecosystem per week (the
  # builder merges it on green). Major bumps stay separate, one PR each.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Production builds install with npm (Dockerfile); CI installs with yarn,
  # which doesn't enforce peer dependencies, so a bump can pass CI and still
  # break the deploy.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # These versions need tailwindcss 3+, and we're on 2 (#131). Lift this
      # with the Tailwind upgrade (#181).
      - dependency-name: "@tailwindcss/forms"
        versions: [">=0.4.0"]
      - dependency-name: "@tailwindcss/typography"
        versions: [">=0.5.0"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
