version: '3.8'

services:
  web:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile_v7
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # - assets:/var/www/site/current/public

  rails:
    image: ghcr.io/seocahill/abairt:latest
    deploy:
      mode: replicated
      replicas: 1
    environment:
      REDIS_URL: redis://redis:6379
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_PATH: "/usr/local/bundle"
      BUNDLE_WITHOUT: "development:test"
    secrets:
      - source: master_key
        target: /rails/config/master.key
    volumes:
      - db:/rails/storage
      # - assets:/rails/public
    command:
      - /bin/bash
      - -c
      - |
        bin/rails db:create db:migrate
        bin/rails s -p 3000 -b 0.0.0.0

  # litestream:
  #   image: litestream/litestream
  #   deploy:
  #     replicas: 1
  #   secrets:
  #     - source: litestream_v5
  #       target: /etc/litestream.yml
  #   volumes:
  #     - db:/data
  #   user: "1000:1000"
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       litestream restore -if-db-not-exists /data/production.sqlite3
  #       litestream replicate

  backup:
    image: amazon/aws-cli:latest
    volumes:
      - db:/data:ro
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Install dependencies
        yum install -y tar gzip findutils

        # Backup function
        backup() {
          BACKUP_DATE=$$(date +%Y%m%d-%H%M)
          BACKUP_DIR="/tmp/db-backup"
          S3_BUCKET="s3://abairt-db/backups"

          mkdir -p $$BACKUP_DIR

          # Copy database files
          cp /data/production.sqlite3 $$BACKUP_DIR/ 2>/dev/null || true
          cp /data/production.sqlite3-wal $$BACKUP_DIR/ 2>/dev/null || true
          cp /data/production.sqlite3-shm $$BACKUP_DIR/ 2>/dev/null || true

          # Create tarball
          cd $$BACKUP_DIR
          tar czf /tmp/abairt-db-backup-$$BACKUP_DATE.tar.gz production.sqlite3*

          # Upload to S3
          aws s3 cp /tmp/abairt-db-backup-$$BACKUP_DATE.tar.gz $$S3_BUCKET/abairt-db-backup-$$BACKUP_DATE.tar.gz

          # Cleanup
          rm -rf $$BACKUP_DIR /tmp/abairt-db-backup-$$BACKUP_DATE.tar.gz

          echo "$$(date): Backup completed - abairt-db-backup-$$BACKUP_DATE.tar.gz"
        }

        # Run backup every 6 hours
        while true; do
          backup
          sleep 21600  # 6 hours
        done

  redis:
    image: redis:alpine
    ports: []

volumes:
  db:
    external: true
    name: abairt_db
  vector_db:
  caddy_data:
  caddy_config:
  # assets:

configs:
  caddyfile_v7:
    file: ./Caddyfile

secrets:
  master_key:
    file: ./config/master.key